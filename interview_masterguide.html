What is synchronous_commit = off in PostgreSQL?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Commits return immediately to the client without waiting for WAL disk flush, boosting throughput at the risk of losing recent transactions on crash."}], "id": "q70"}, {"num": 71, "title": "What is an index bloat and how does it happen in PostgreSQL?", "answer": "<p>When rows are frequently updated or deleted, PostgreSQL creates dead tuples. While <code>VACUUM</code> marks table space as reusable, B-Tree index pages often cannot shrink or merge, leaving sparse and bloated index structures that waste disk cache and slow down queries. Fixed with <code>REINDEX CONCURRENTLY</code>.</p>", "weak_spot": "Standard REINDEX locks writes; REINDEX CONCURRENTLY avoids table locking.", "followups": [{"q": "Why is autovacuum tuning critical for high-throughput tables?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Aggressive autovacuum prevents transaction ID wraparound and table bloat."}], "id": "q71"}, {"num": 72, "title": "What is the difference between RPO and RTO in Disaster Recovery?", "answer": "<p><strong>RPO (Recovery Point Objective):</strong> The maximum acceptable age of files that must be recovered from backup storage for normal operations to resume (i.e. maximum tolerable data loss).<br><strong>RTO (Recovery Time Objective):</strong> The maximum acceptable length of time that can elapse before a system is restored after an outage (i.e. maximum tolerable downtime).</p>", "weak_spot": "Zero RPO requires continuous synchronous replication, which adds network latency to every transaction.", "followups": [{"q": "How does this copilot impact RTO?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Speeds up diagnosis from 20 minutes to under 4 seconds, directly shrinking RTO."}], "id": "q72"}, {"num": 73, "title": "Explain the difference between L4 and L7 Load Balancing.", "answer": "<p><strong>Layer 4 (L4):</strong> Operates at the transport layer (TCP/UDP), routing packets based on IP and port without inspecting HTTP headers or cookies (extremely fast, low CPU).<br><strong>Layer 7 (L7):</strong> Operates at the application layer, inspecting HTTP paths, headers, cookies, and TLS termination (allows smart path routing like /api to backend and / to frontend, as used in Vercel/Render).</p>", "weak_spot": "L7 load balancing requires SSL termination and deeper CPU processing.", "followups": [{"q": "Which layer handles SSL termination?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Typically L7, though L4 can pass through encrypted TLS with SNI inspection."}], "id": "q73"}, {"num": 74, "title": "Explain Circuit Breaker pattern in distributed systems.", "answer": "<p>When a downstream service fails repeatedly, a circuit breaker trips into an 'Open' state, immediately failing calls without waiting for network timeouts. After a cooldown, it moves to 'Half-Open', allowing a canary request to test recovery before closing the circuit.</p>", "weak_spot": "Without circuit breakers, failing downstreams cause thread pool exhaustion and cascading system crashes.", "followups": [{"q": "How would a circuit breaker help your MCP collectors?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "If Render API returns 500s repeatedly, trip the circuit to avoid waiting 300ms on each incident triage."}], "id": "q74"}, {"num": 75, "title": "What is exponential backoff with jitter?", "answer": "<p>When retrying failed network calls, each retry delay doubles exponentially (1s, 2s, 4s, 8s). <strong>Jitter</strong> adds a random variation to the delay (e.g. 2s &plusmn; 300ms) to prevent thousands of retrying clients from hitting the server at the exact same millisecond (thundering herd).</p>", "weak_spot": "Always add a maximum retry ceiling to avoid infinite retry loops.", "followups": [{"q": "What is Full Jitter vs Equal Jitter?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Full Jitter picks randomly between 0 and the exponential backoff bound."}], "id": "q75"}, {"num": 76, "title": "How does DNS propagation work and why is TTL important?", "answer": "<p>DNS resolvers cache IP mapping based on the Record's Time to Live (TTL). Low TTL (60s) allows fast IP failover during outages, but increases DNS query traffic. High TTL reduces query latency, but delays failover propagation when switching IP endpoints.</p>", "weak_spot": "Some ISP resolvers violate RFCs and cache longer than the configured TTL.", "followups": [{"q": "How do you prepare DNS before a major server migration?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Lower DNS TTL to 60s 48 hours before migration to ensure instant cutover."}], "id": "q76"}, {"num": 77, "title": "What is OpenTelemetry and how would you instrument this copilot?", "answer": "<p><strong>OpenTelemetry (OTel)</strong> is a vendor-neutral observability framework for distributed tracing and metrics. We would instrument FastAPI endpoints with <code>FastAPIInstrumentor</code>, creating trace spans for <code>vector_search</code>, <code>mcp_telemetry</code>, and <code>llm_generation</code> exported to Jaeger or Datadog.</p>", "weak_spot": "Tracing adds a minute amount of CPU and network overhead for telemetry span export.", "followups": [{"q": "What is a Trace ID vs Span ID?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Trace ID represents the entire end-to-end request; Span ID represents an individual unit of work within the trace."}], "id": "q77"}, {"num": 78, "title": "Explain Blameless Postmortems in SRE culture.", "answer": "<p>A blameless postmortem assumes that engineers act in good faith with the information available. Instead of punishing human error ('engineer X pushed bad code'), it investigates systemic failures ('why did CI/CD allow untested code to reach production without canaries?'), creating psychological safety to document and learn from failures.</p>", "weak_spot": "The auto-postmortem flywheel (/postmortem/generate) is specifically modeled after the Google SRE blameless postmortem framework.", "followups": [{"q": "What are the five essential sections of an SRE postmortem?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Summary, Impact, Timeline, Root Cause (5-Whys), and Action Items."}], "id": "q78"}, {"num": 79, "title": "What is the difference between RAGAS and LLM-as-judge?", "answer": "<p><strong>LLM-as-judge:</strong> Uses an advanced model (GPT-4 / Gemini 1.5 Pro) with prompt rubrics to evaluate generated answers.<br><strong>RAGAS:</strong> A specialized evaluation framework that computes mathematical metrics for RAG: Faithfulness (is the answer grounded in context?), Answer Relevance (does it answer the prompt?), and Context Recall (did retrieval fetch ground-truth documents?).</p>", "weak_spot": "RAGAS requires a ground-truth labeled benchmark dataset to compute recall.", "followups": [{"q": "How would you build an automated CI/CD eval pipeline for runbooks?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Run RAGAS against 50 simulated alerts on every pull request."}], "id": "q79"}, {"num": 80, "title": "Explain Semantic Caching in AI systems.", "answer": "<p>Traditional caching requires exact string matches. Semantic caching embeds the incoming alert and checks if a previously cached incident has a cosine similarity > 0.96. If matched, it returns the cached triage report in 5ms without calling the LLM, cutting costs by 80% during alert storms.</p>", "weak_spot": "High similarity threshold is critical; small variations in error codes can point to completely different root causes.", "followups": [{"q": "What tool implements semantic caching?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "GPTCache or Redis Vector Similarity Search."}], "id": "q80"}, {"num": 81, "title": "What is BM25 and why combine it with Vector Search (Hybrid Search)?", "answer": "<p><strong>BM25:</strong> Probabilistic term-frequency ranking algorithm (best-in-class keyword search).<br><strong>Dense Vectors:</strong> Great at semantic meaning (latency &approx; timeout), but poor at exact string matching (error code <code>ERR_0x42A</code>).<br><strong>Hybrid Search:</strong> Merges BM25 score and vector cosine score using Reciprocal Rank Fusion (RRF) for the best of both worlds.</p>", "weak_spot": "Hybrid search requires indexing both inverted text indexes and vector embeddings.", "followups": [{"q": "What is Reciprocal Rank Fusion (RRF)?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "A rank-aggregation algorithm that combines rankings from different search methods: RRF_score = sum(1 / (k + rank))."}], "id": "q81"}, {"num": 82, "title": "Explain Zero-Trust Network Architecture (ZTNA).", "answer": "<p>ZTNA assumes that threats exist both inside and outside the network perimeter. It enforces strict identity verification, mutual TLS (mTLS), least-privilege access, and continuous validation for every connection, rather than trusting anything inside a corporate VPN.</p>", "weak_spot": "In production, our copilot would connect to internal databases via ephemeral mTLS certificates rather than static database URLs.", "followups": [{"q": "How would you secure the database connection with Neon?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Enforce sslmode=require and store connection secrets in cloud secret managers."}], "id": "q82"}, {"num": 83, "title": "What is Pg_stat_statements and why is it essential for database observability?", "answer": "<p>A PostgreSQL extension that records execution statistics of all SQL statements executed by the server (total execution time, calls, mean time, rows returned). It allows SREs to find the top 5 most expensive queries degrading database performance over time.</p>", "weak_spot": "pg_stat_statements tracks historical aggregates; pg_stat_activity tracks real-time active connections.", "followups": [{"q": "How do you reset statistics in pg_stat_statements?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "SELECT pg_stat_statements_reset();"}], "id": "q83"}, {"num": 84, "title": "What is the difference between Blue-Green Deployment and Canary Deployment?", "answer": "<p><strong>Blue-Green:</strong> Two identical environments (Blue=Live, Green=Idle). Deploy to Green, test, then switch router traffic instantly (zero downtime, instant rollback).<br><strong>Canary:</strong> Gradually routes a small percentage of user traffic (e.g. 5%) to the new version while monitoring error rates before rolling out to 100%.</p>", "weak_spot": "Blue-Green requires double the compute infrastructure cost during deployment.", "followups": [{"q": "How does Canary deployment prevent catastrophic outages?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Catches fatal bugs on a small sample of users without impacting the entire user base."}], "id": "q84"}, {"num": 85, "title": "Explain Time to Recovery (TTR) distribution: P50, P90, P99.", "answer": "<p>Averages hide reality. P50 is the median recovery time; P99 represents the worst 1% of outages (complex cascading failures). Monitoring P99 ensures that complex edge cases are identified and addressed rather than masked by simple fast-resolved incidents.</p>", "weak_spot": "Mean MTTR is skewed by outliers; percentiles provide honest operational visibility.", "followups": [{"q": "Why do SREs focus on P99 latency rather than mean latency?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "In high-scale services, 1% of requests represents thousands of frustrating user experiences."}], "id": "q85"}, {"num": 86, "title": "How would you handle air-gapped deployments for government or healthcare clients?", "answer": "<p>1. Deploy the backend with local Ollama (Llama 3.1) and local embedding models (Nomic Embed Text) running on on-premise GPUs.<br>2. Run ChromaDB fully local with persistent network-attached storage.<br>3. Connect telemetry to local Prometheus, Jaeger, and self-hosted PostgreSQL.<br>4. Zero external network egress, ensuring zero sensitive log data leaves the private network perimeter.</p>", "weak_spot": "Local 8B models require at least 8GB\u201316GB of VRAM on dedicated GPUs for reasonable inference latency.", "followups": [{"q": "What quantization format runs well on CPUs?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "GGUF 4-bit or 8-bit quantized models running via llama.cpp / Ollama."}], "id": "q86"}]}, {"id": "mod13", "title": "Module 13: Live Deployment & Demo Verification Walkthrough", "badge": "Live Demo Guide", "desc": "How to showcase the live production deployment to interviewers and hiring managers.", "questions": [{"num": 87, "title": "How do you demonstrate the live deployment during an interview?", "answer": "<p><strong>Step-by-Step Live Demo Script:</strong></p><ol class='list-decimal pl-5 space-y-1.5 my-2'><li><strong>Open Live URL:</strong> Navigate to <a href='https://devops-incident-copilot.vercel.app/' target='_blank' class='text-sky-400 underline'>https://devops-incident-copilot.vercel.app/</a>.</li><li><strong>Trigger Streaming Incident:</strong> Select preset <em>'504 Gateway Timeout'</em> and click <strong>Triage Incident</strong>. Point out the animated <strong>Agent Reasoning Terminal</strong> streaming Server-Sent Events (SSE) live from the Render backend.</li><li><strong>Show RAG Provenance:</strong> Expand the <em>'Retrieved RAG Knowledge Base Sources'</em> drawer to show cosine similarity percentages and exact SOP source filenames.</li><li><strong>Test User Method 1 (Website Prober):</strong> Switch to the <strong>'Diagnose My Website'</strong> tab, enter <code>https://httpstat.us/504</code>, and show live TTFB latency, SSL certificate health, and edge headers.</li><li><strong>Test Chaos Sandbox:</strong> Switch to the <strong>'Chaos Sandbox'</strong> tab and click <em>'PostgreSQL AccessExclusiveLock Contention'</em> to demo 1-click failure simulation.</li><li><strong>Execute Remediation & Postmortem:</strong> Click <strong>Run Remediation</strong> on a SQL block, then click <strong>Resolve & Index Postmortem</strong> to show dynamic vector indexing into ChromaDB!</li></ol>", "weak_spot": "Always ensure Render backend is awake before your interview by visiting the /health endpoint 2 minutes early.", "followups": [{"q": "What is the cold-start wake-up time on Render's free tier?", "a": "Execute diagnostic validation commands, verify telemetry logs, and follow the SRE mitigation runbook."}, {"q": "", "a": "Approximately 45-60 seconds if inactive for over 15 minutes."}], "id": "q87"}]}]};

    const desktopNav = document.getElementById('desktop-nav-list');
    const mobileNav = document.getElementById('mobile-nav-list');
    const contentContainer = document.getElementById('content-container');
    const desktopSearch = document.getElementById('desktop-search-input');
    const mobileSearch = document.getElementById('mobile-search-input');
    const reviewedCountSpan = document.getElementById('reviewed-count');
    const totalCountSpan = document.getElementById('total-count');
    const mobileDrawer = document.getElementById('mobile-drawer');
    const mobileBackdrop = document.getElementById('mobile-drawer-backdrop');

    let reviewedQuestions = new Set(JSON.parse(localStorage.getItem('reviewed_q') || '[]'));
    let totalQuestionsCount = 0;

    data.modules.forEach(m => totalQuestionsCount += m.questions.length);
    totalCountSpan.textContent = totalQuestionsCount;
    updateReviewedCounter();

    function toggleMobileMenu() {
      const isOpen = !mobileDrawer.classList.contains('-translate-x-full');
      if (isOpen) {
        mobileDrawer.classList.add('-translate-x-full');
        mobileBackdrop.classList.add('hidden');
      } else {
        mobileDrawer.classList.remove('-translate-x-full');
        mobileBackdrop.classList.remove('hidden');
      }
    }

    function updateReviewedCounter() {
      reviewedCountSpan.textContent = reviewedQuestions.size;
      localStorage.setItem('reviewed_q', JSON.stringify(Array.from(reviewedQuestions)));
    }

    function toggleReviewed(qId) {
      if (reviewedQuestions.has(qId)) {
        reviewedQuestions.delete(qId);
      } else {
        reviewedQuestions.add(qId);
      }
      updateReviewedCounter();
      renderCheckmark(qId);
    }

    function renderCheckmark(qId) {
      const btn = document.getElementById(`check-${qId}`);
      if (btn) {
        if (reviewedQuestions.has(qId)) {
          btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/40');
          btn.classList.remove('bg-slate-900', 'text-slate-400');
          btn.innerHTML = '✓ Reviewed';
        } else {
          btn.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/40');
          btn.classList.add('bg-slate-900', 'text-slate-400');
          btn.innerHTML = 'Mark Reviewed';
        }
      }
    }

    // Toggle interactive answer for follow-up questions
    function toggleFollowup(btnId, ansId) {
      const ansElem = document.getElementById(ansId);
      const btnElem = document.getElementById(btnId);
      if (!ansElem || !btnElem) return;

      const isHidden = ansElem.classList.contains('hidden');
      if (isHidden) {
        ansElem.classList.remove('hidden');
        btnElem.innerHTML = '<span>Hide Solution</span> <svg class="w-3 h-3 rotate-180 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';
        btnElem.classList.add('text-sky-300', 'bg-sky-950/60');
      } else {
        ansElem.classList.add('hidden');
        btnElem.innerHTML = '<span>View Solution</span> <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';
        btnElem.classList.remove('text-sky-300', 'bg-sky-950/60');
      }
    }

    // Render Navigation for both Desktop and Mobile
    const navItemsHtml = data.modules.map((m, idx) => `
      <a href="#${m.id}" onclick="if(window.innerWidth < 1024) toggleMobileMenu()" class="flex items-center justify-between px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-900 transition-colors">
        <span class="truncate font-medium">${idx + 1}. ${m.title.split(':')[0]}</span>
        <span class="text-[10px] font-mono text-slate-500 bg-slate-950 px-1.5 py-0.2 rounded border border-slate-900">${m.questions.length}</span>
      </a>
    `).join('');

    desktopNav.innerHTML = navItemsHtml;
    mobileNav.innerHTML = navItemsHtml;

    // Render Main Content
    function renderMainContent(filterText = '') {
      contentContainer.innerHTML = '';
      const filter = filterText.toLowerCase();

      data.modules.forEach((mod) => {
        const filteredQuestions = mod.questions.filter(q => 
          q.title.toLowerCase().includes(filter) || 
          q.answer.toLowerCase().includes(filter) ||
          (q.weak_spot && q.weak_spot.toLowerCase().includes(filter)) ||
          (q.followups && JSON.stringify(q.followups).toLowerCase().includes(filter))
        );

        if (filteredQuestions.length === 0) return;

        const modSection = document.createElement('section');
        modSection.id = mod.id;
        modSection.className = 'flex flex-col gap-4 scroll-mt-20';

        modSection.innerHTML = `
          <div class="border-b border-slate-800 pb-3 flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="text-[10px] sm:text-[11px] font-mono text-sky-400 font-semibold uppercase tracking-wider">${mod.badge || 'Module'}</span>
              <h2 class="text-base sm:text-lg font-bold text-white tracking-tight">${mod.title}</h2>
              <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">${mod.desc}</p>
            </div>
            <span class="text-[11px] sm:text-xs font-mono text-slate-500 bg-slate-900 px-2 py-0.5 sm:py-1 rounded border border-slate-800">${filteredQuestions.length} Qs</span>
          </div>

          <div class="flex flex-col gap-4">
            ${filteredQuestions.map(q => {
              const qKey = q.id || q.num;
              return `
              <div class="glass-card rounded-xl p-3.5 sm:p-5 flex flex-col gap-3 transition-all" id="card-${qKey}">
                <div class="flex items-start justify-between gap-2 sm:gap-3">
                  <h3 class="text-xs sm:text-sm font-bold text-white flex items-baseline gap-1.5 sm:gap-2 leading-snug">
                    <span class="text-sky-400 font-mono text-[11px] sm:text-xs font-bold">#${q.num}</span>
                    <span>${q.title}</span>
                  </h3>
                  <button id="check-${qKey}" onclick="toggleReviewed('${qKey}')" class="text-[10px] font-mono px-2 py-1 rounded border border-slate-800 transition-colors shrink-0">
                    Mark Reviewed
                  </button>
                </div>

                <!-- Answer Content -->
                <div class="text-[11px] sm:text-xs leading-relaxed text-slate-300 space-y-2 border-l-2 border-sky-500/40 pl-3 sm:pl-3.5 my-1 overflow-x-auto">
                  ${q.answer}
                </div>

                <!-- Weak Spot / Trap Warning -->
                ${q.weak_spot ? `
                  <div class="rounded-lg bg-rose-950/20 border border-rose-500/30 p-2.5 sm:p-3 flex items-start gap-2 text-xs text-rose-300">
                    <span class="text-rose-400 font-bold shrink-0 text-[11px]">⚠️ WEAK SPOT / TRAP:</span>
                    <span class="text-[10px] sm:text-[11px] leading-relaxed">${q.weak_spot}</span>
                  </div>
                ` : ''}

                <!-- Interactive Follow-up Questions with Reveal Buttons -->
                ${q.followups && q.followups.length > 0 ? `
                  <div class="rounded-lg bg-slate-950/80 border border-slate-800/80 p-3 space-y-2.5">
                    <span class="text-[11px] font-mono font-semibold text-slate-400 flex items-center gap-1.5">
                      <span class="text-amber-400">⚡</span> Follow-up Questions & Solutions:
                    </span>
                    <div class="space-y-2">
                      ${q.followups.map((item, fIdx) => {
                        const isObj = typeof item === 'object' && item !== null;
                        const fQuestion = isObj ? item.q : (item.includes('Answer:') ? item.split('Answer:')[0].trim() : item);
                        const fAnswer = isObj ? item.a : (item.includes('Answer:') ? item.split('Answer:')[1].trim() : (item.startsWith('Answer:') ? item.replace('Answer:', '').trim() : 'Click below to reveal solution.'));
                        const btnId = `btn-f-${qKey}-${fIdx}`;
                        const ansId = `ans-f-${qKey}-${fIdx}`;

                        return `
                          <div class="p-2 sm:p-2.5 rounded bg-slate-900/90 border border-slate-800/90 text-[11px] space-y-1.5">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                              <span class="font-medium text-slate-200"><strong>${fIdx + 1}.</strong> ${fQuestion}</span>
                              <button id="${btnId}" onclick="toggleFollowup('${btnId}', '${ansId}')" class="self-start sm:self-auto flex items-center gap-1 text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700/80 transition-colors shrink-0">
                                <span>View Solution</span>
                                <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                              </button>
                            </div>
                            <div id="${ansId}" class="hidden pt-2 border-t border-slate-800/80 text-[11px] text-emerald-300 leading-relaxed bg-slate-950/50 p-2 rounded">
                              <span class="font-mono text-emerald-400 font-semibold text-[10px] uppercase">Solution:</span> ${fAnswer}
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
              `;
            }).join('')}
          </div>
        `;

        contentContainer.appendChild(modSection);
        filteredQuestions.forEach(q => renderCheckmark(q.id || q.num));
      });
    }

    // Sync searches
    desktopSearch.addEventListener('input', (e) => {
      renderMainContent(e.target.value);
      mobileSearch.value = e.target.value;
    });

    mobileSearch.addEventListener('input', (e) => {
      renderMainContent(e.target.value);
      desktopSearch.value = e.target.value;
    });

    renderMainContent();
  </script>
</body>
</html>
