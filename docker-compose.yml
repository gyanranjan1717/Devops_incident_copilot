version: '3.8'

services:
  # Optional local PostgreSQL for isolated staging testing
  postgres:
    image: postgres:16-alpine
    container_name: devops_copilot_postgres
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: devops_copilot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
